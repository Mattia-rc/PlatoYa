spring:
  application:
    name: platoya-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platoya}
    username: ${DB_USER:platoya}
    password: ${DB_PASSWORD:platoya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

platoya:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
